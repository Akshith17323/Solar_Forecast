[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "project-backend-starter"
version = "0.1.0"
description = "Configuration-driven backend scaffold for a still-planning ML project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.18,<1",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/project_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
